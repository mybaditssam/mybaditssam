  <text font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="54" font-weight="800" letter-spacing="-1.6" fill="#fdfcfa">
    <tspan x="62" y="150">I build the tools</tspan>
    <tspan x="62" y="208">insurance agencies</tspan>
    <tspan x="62" y="266" fill="#7ccdd6">run on.</tspan>
  </text>
  <text font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="17" font-weight="400" fill="#c9c6c1">
    <tspan x="64" y="314">Eight years inside an agency, running Salesforce, data and product.</tspan>
    <tspan x="64" y="340">Now I ship the CRM, dialer and paperwork agents use every day.</tspan>
  </text>

